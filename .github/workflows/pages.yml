name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Fetch data
        run: |
          mkdir -p data
          curl -fsSL --retry 3 --retry-delay 5 http://159.195.149.250/count | \
            python3 -c 'import json,sys,datetime; d=json.load(sys.stdin); d["updated"]=datetime.datetime.now(datetime.timezone.utc).isoformat(); print(json.dumps(d))' \
            > data/count.json
          curl -fsSL --retry 3 --retry-delay 5 "http://159.195.149.250/query?prefix=2001:558:142::/48" | \
            python3 -c 'import json,sys,datetime; e=[{"addr":p[0],"last_seen":p[1]} for p in (l.strip().rsplit(",",1) for l in sys.stdin if l.strip())]; print(json.dumps({"prefix":"2001:558:142::/48","count":len(e),"addresses":e,"updated":datetime.datetime.now(datetime.timezone.utc).isoformat()}))' \
            > data/prefix-2001-558-142.json
          curl -fsSL --retry 3 --retry-delay 5 "http://159.195.149.250/query?prefix=2a0d:3341:b300::/48" | \
            python3 -c 'import json,sys,datetime; e=[{"addr":p[0],"last_seen":p[1]} for p in (l.strip().rsplit(",",1) for l in sys.stdin if l.strip())]; print(json.dumps({"prefix":"2a0d:3341:b300::/48","count":len(e),"addresses":e,"updated":datetime.datetime.now(datetime.timezone.utc).isoformat()}))' \
            > data/prefix-2a0d-3341-b300.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
